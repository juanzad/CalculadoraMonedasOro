const { useState, useEffect, useMemo } = React;

const Settings = mkIcon('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>');

const RotateCcw = mkIcon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>');
const FileText = mkIcon('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>');

/* ----------------------------------------------------------------
   DATOS Y LÓGICA DE CÁLCULO (idéntica al programa original)
---------------------------------------------------------------- */
const TROY_ONCE_GRAMS = 31.1034768;

const PRESET_COINS = [
  { id: "centenario-mex", name: "Centenario (50 Pesos Oro)", totalWeight: 41.67, purity: 0.900, fineGoldWeight: 37.5, description: "La moneda de oro más famosa de México y muy valorada en Argentina. Contiene exactamente 37.5 gramos de oro puro." },
  { id: "krugerrand-sa", name: "Krugerrand (1 oz)", totalWeight: 33.93, purity: 0.9167, fineGoldWeight: 31.1035, description: "Moneda de origen sudafricano. Su peso bruto incluye aleación de cobre para mayor durabilidad, pero contiene 1 onza troy de oro puro." },
  { id: "argentino-5pesos", name: "Argentino (5 Pesos Oro)", totalWeight: 8.0645, purity: 0.900, fineGoldWeight: 7.258, description: "Moneda nacional acuñada entre 1881 y 1896. Un clásico muy cotizado en el mercado numismático e inversor local." },
  { id: "soberano-uk", name: "Soberano (Libra Esterlina)", totalWeight: 7.988, purity: 0.9167, fineGoldWeight: 7.322, description: "Famosa moneda británica de alta liquidez internacional. Contiene 7.322 gramos de oro fino de 22 quilates." },
  { id: "double-eagle-us", name: "Double Eagle ($20 USD)", totalWeight: 33.436, purity: 0.900, fineGoldWeight: 30.092, description: "Moneda histórica de Estados Unidos acuñada hasta 1933. Muy popular por su valor histórico y de metal." },
  { id: "napoleon-fr", name: "Napoleón (20 Francos)", totalWeight: 6.451, purity: 0.900, fineGoldWeight: 5.806, description: "Moneda tradicional francesa de 20 francos (coq o napoléon). Ideal para pequeños inversores por su liquidez." },
  { id: "libertad-mex", name: "Libertad (1 oz)", totalWeight: 31.1035, purity: 0.999, fineGoldWeight: 31.1035, description: "Moneda moderna de acuñación mexicana de oro puro ley .999." },
  { id: "maple-leaf-ca", name: "Maple Leaf (1 oz)", totalWeight: 31.11, purity: 0.9999, fineGoldWeight: 31.1035, description: "Acuñada por la Real Casa de la Moneda de Canadá, es una de las monedas de oro puro más populares del mundo con ley .9999." },
  { id: "condor-chile-100", name: "Cóndor (100 Pesos Chile)", totalWeight: 20.339, purity: 0.900, fineGoldWeight: 18.305, description: "Moneda chilena de 100 pesos (acuñada desde 1926), también llamada 'Liberty'. Peso bruto 20,339 g, ley 0,900, con 18,3 g de oro fino." },
];

const DEFAULT_SETTINGS = {
  ouncePriceUsd: 2380.0,
  discountArgentinaPercent: 4.5,
  usdExchangeRateArs: 1240.0,
  buySpreadPercent: 5.0,
  sellSpreadPercent: 2.0,
};

function calculateCoinValue(coin, settings) {
  const { ouncePriceUsd, discountArgentinaPercent, usdExchangeRateArs, buySpreadPercent, sellSpreadPercent } = settings;
  const fineGoldGrams = coin.fineGoldWeight > 0 ? coin.fineGoldWeight : (coin.totalWeight * coin.purity);
  const fineGoldOunces = fineGoldGrams / TROY_ONCE_GRAMS;
  const spotValueUsd = fineGoldOunces * ouncePriceUsd;
  const spotValueArs = spotValueUsd * usdExchangeRateArs;
  const discountFraction = discountArgentinaPercent / 100;
  const localRefValueUsd = spotValueUsd * (1 - discountFraction);
  const localRefValueArs = localRefValueUsd * usdExchangeRateArs;
  const buyFraction = buySpreadPercent / 100;
  const buyPriceUsd = localRefValueUsd * (1 - buyFraction);
  const buyPriceArs = buyPriceUsd * usdExchangeRateArs;
  const sellFraction = sellSpreadPercent / 100;
  const sellPriceUsd = localRefValueUsd * (1 + sellFraction);
  const sellPriceArs = sellPriceUsd * usdExchangeRateArs;
  const discountAmountUsd = spotValueUsd * discountFraction;
  const buySpreadAmountUsd = localRefValueUsd * buyFraction;
  const sellSpreadAmountUsd = localRefValueUsd * sellFraction;
  return { coin, fineGoldGrams, fineGoldOunces, spotValueUsd, spotValueArs, localRefValueUsd, localRefValueArs, buyPriceUsd, buyPriceArs, sellPriceUsd, sellPriceArs, discountAmountUsd, buySpreadAmountUsd, sellSpreadAmountUsd };
}

function formatCurrency(value, currency, decimals = 2) {
  const safeValue = (typeof value === "number" && !isNaN(value) && isFinite(value)) ? value : 0;
  if (currency === "USD") {
    return new Intl.NumberFormat("es-AR", { style: "currency", currency: "USD", minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(safeValue);
  }
  return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(safeValue);
}

function formatNumber(value, decimals = 3) {
  const safeValue = (typeof value === "number" && !isNaN(value) && isFinite(value)) ? value : 0;
  return new Intl.NumberFormat("es-AR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(safeValue);
}

/* copia al portapapeles con fallback */
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
  } catch (e) { /* noop */ }
  fallbackCopy(text);
  return Promise.resolve();
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  } catch (e) { /* noop */ }
}

/* localStorage seguro */
const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* noop */ } },
};

/* ----------------------------------------------------------------
   APP
---------------------------------------------------------------- */
function App() {
  const [settings, setSettings] = useState(() => {
    try {
      const saved = store.get("gold_calc_settings");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
          const n = (v, d) => (typeof v === "number" && !isNaN(v)) ? v : d;
          return {
            ouncePriceUsd: n(parsed.ouncePriceUsd, DEFAULT_SETTINGS.ouncePriceUsd),
            discountArgentinaPercent: n(parsed.discountArgentinaPercent, DEFAULT_SETTINGS.discountArgentinaPercent),
            usdExchangeRateArs: n(parsed.usdExchangeRateArs, DEFAULT_SETTINGS.usdExchangeRateArs),
            buySpreadPercent: n(parsed.buySpreadPercent, DEFAULT_SETTINGS.buySpreadPercent),
            sellSpreadPercent: n(parsed.sellSpreadPercent, DEFAULT_SETTINGS.sellSpreadPercent),
          };
        }
      }
    } catch (e) { /* noop */ }
    return DEFAULT_SETTINGS;
  });

  const [customCoins, setCustomCoins] = useState(() => {
    try {
      const saved = store.get("gold_calc_custom_coins");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          return parsed.filter(c => c && typeof c === "object" && typeof c.id === "string" && typeof c.name === "string" && typeof c.totalWeight === "number" && typeof c.purity === "number" && typeof c.fineGoldWeight === "number");
        }
      }
    } catch (e) { /* noop */ }
    return [];
  });

  const [selectedCoinId, setSelectedCoinId] = useState(() => PRESET_COINS[0].id);

  const [cartItems, setCartItems] = useState(() => {
    try {
      const saved = store.get("gold_calc_cart");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          return parsed.filter(item => item && typeof item === "object" && typeof item.coinId === "string" && typeof item.quantity === "number");
        }
      }
    } catch (e) { /* noop */ }
    return [];
  });

  const [isAddingCoin, setIsAddingCoin] = useState(false);
  const [newCoinName, setNewCoinName] = useState("");
  const [newCoinTotalWeight, setNewCoinTotalWeight] = useState("");
  const [newCoinPurity, setNewCoinPurity] = useState("0.900");
  const [newCoinFineWeight, setNewCoinFineWeight] = useState("");
  const [purityInputType, setPurityInputType] = useState("percentage");

  const [confirmDialog, setConfirmDialog] = useState(null);

  const [activeTab, setActiveTab] = useState("individual");
  const [isFullScreenComparativa, setIsFullScreenComparativa] = useState(false);
  const [unitSystem, setUnitSystem] = useState("USD");
  const [calculatorInfoOpen, setCalculatorInfoOpen] = useState(false);
  const [notification, setNotification] = useState(null);

  const triggerNotification = (message) => {
    setNotification(message);
    window.clearTimeout(triggerNotification._t);
    triggerNotification._t = window.setTimeout(() => setNotification(null), 2800);
  };

  // Trae la cotización spot del oro (USD/oz) desde una API pública gratuita.
  // Kitco no permite leerse directo desde el navegador (CORS); se usa una
  // fuente equivalente y, si falla, se mantiene el valor cargado a mano.
  const [isFetchingPrice, setIsFetchingPrice] = useState(false);
  const [priceStatus, setPriceStatus] = useState(null); // null | "ok" | "err"

  const fetchLiveGoldPrice = async (notify) => {
    setIsFetchingPrice(true);
    const sources = [
      { url: "https://api.gold-api.com/price/XAU", pick: (d) => d && d.price },
      { url: "https://data-asg.goldprice.org/dbXRates/USD", pick: (d) => d && d.items && d.items[0] && d.items[0].xauPrice },
    ];
    for (let i = 0; i < sources.length; i++) {
      try {
        const res = await fetch(sources[i].url, { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();
        const price = sources[i].pick(data);
        if (typeof price === "number" && price > 500 && price < 20000) {
          const val = parseFloat(price.toFixed(2));
          setSettings((prev) => ({ ...prev, ouncePriceUsd: val }));
          setPriceStatus("ok");
          setIsFetchingPrice(false);
          if (notify) triggerNotification("Onza actualizada: U$S " + val.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
          return true;
        }
      } catch (e) { /* probar la siguiente fuente */ }
    }
    setPriceStatus("err");
    setIsFetchingPrice(false);
    if (notify) triggerNotification("No se pudo traer la cotización ahora. Cargá el valor a mano.");
    return false;
  };

  // Al abrir, intenta traer la cotización en vivo una vez.
  useEffect(() => { fetchLiveGoldPrice(false); }, []);

  useEffect(() => { store.set("gold_calc_settings", JSON.stringify(settings)); }, [settings]);
  useEffect(() => { store.set("gold_calc_custom_coins", JSON.stringify(customCoins)); }, [customCoins]);
  useEffect(() => { store.set("gold_calc_cart", JSON.stringify(cartItems)); }, [cartItems]);

  const allCoinsMap = useMemo(() => {
    const map = new Map();
    PRESET_COINS.forEach(c => map.set(c.id, c));
    customCoins.forEach(c => map.set(c.id, c));
    return map;
  }, [customCoins]);

  const allCoinsList = useMemo(() => [...PRESET_COINS, ...customCoins], [customCoins]);
  const selectedCoinObj = useMemo(() => allCoinsMap.get(selectedCoinId) || PRESET_COINS[0], [selectedCoinId, allCoinsMap]);
  const selectedCoinResult = useMemo(() => calculateCoinValue(selectedCoinObj, settings), [selectedCoinObj, settings]);
  const allCoinsCalculated = useMemo(() => allCoinsList.map(coin => ({ coin, result: calculateCoinValue(coin, settings) })), [allCoinsList, settings]);

  const cartCalculations = useMemo(() => {
    let totalFineGoldGrams = 0, totalSpotValueUsd = 0, totalSpotValueArs = 0, totalLocalRefValueUsd = 0, totalLocalRefValueArs = 0, totalBuyPriceUsd = 0, totalBuyPriceArs = 0, totalSellPriceUsd = 0, totalSellPriceArs = 0;
    const items = cartItems.map(item => {
      const coin = allCoinsMap.get(item.coinId);
      if (!coin) return null;
      const calc = calculateCoinValue(coin, settings);
      const subtotalFineGrams = calc.fineGoldGrams * item.quantity;
      const subtotalSpotUsd = calc.spotValueUsd * item.quantity;
      const subtotalLocalUsd = calc.localRefValueUsd * item.quantity;
      const subtotalBuyUsd = calc.buyPriceUsd * item.quantity;
      const subtotalSellUsd = calc.sellPriceUsd * item.quantity;
      totalFineGoldGrams += subtotalFineGrams;
      totalSpotValueUsd += subtotalSpotUsd;
      totalSpotValueArs += subtotalSpotUsd * settings.usdExchangeRateArs;
      totalLocalRefValueUsd += subtotalLocalUsd;
      totalLocalRefValueArs += subtotalLocalUsd * settings.usdExchangeRateArs;
      totalBuyPriceUsd += subtotalBuyUsd;
      totalBuyPriceArs += subtotalBuyUsd * settings.usdExchangeRateArs;
      totalSellPriceUsd += subtotalSellUsd;
      totalSellPriceArs += subtotalSellUsd * settings.usdExchangeRateArs;
      return { ...item, coin, calc, subtotalFineGrams, subtotalSpotUsd, subtotalBuyUsd, subtotalSellUsd };
    }).filter(Boolean);
    return {
      items,
      totals: { totalFineGoldGrams, totalFineGoldOunces: totalFineGoldGrams / TROY_ONCE_GRAMS, totalSpotValueUsd, totalSpotValueArs, totalLocalRefValueUsd, totalLocalRefValueArs, totalBuyPriceUsd, totalBuyPriceArs, totalSellPriceUsd, totalSellPriceArs },
    };
  }, [cartItems, allCoinsMap, settings]);

  const handleAddNewCoin = (e) => {
    e.preventDefault();
    if (!newCoinName.trim()) return;
    let parsedTotalWeight = parseFloat(newCoinTotalWeight);
    let parsedPurity = parseFloat(newCoinPurity);
    let parsedFineWeight = parseFloat(newCoinFineWeight);
    if (isNaN(parsedTotalWeight) || parsedTotalWeight <= 0) parsedTotalWeight = 0;
    if (isNaN(parsedPurity) || parsedPurity < 0 || parsedPurity > 1) parsedPurity = 1.0;
    let finalFineGoldWeight = 0;
    if (purityInputType === "percentage") {
      finalFineGoldWeight = parsedTotalWeight * parsedPurity;
    } else {
      if (isNaN(parsedFineWeight) || parsedFineWeight <= 0) {
        finalFineGoldWeight = parsedTotalWeight;
      } else {
        finalFineGoldWeight = parsedFineWeight;
        if (parsedTotalWeight > 0) { parsedPurity = finalFineGoldWeight / parsedTotalWeight; if (parsedPurity > 1) parsedPurity = 1; }
      }
    }
    const newCoin = {
      id: "custom-" + Date.now().toString(),
      name: newCoinName,
      totalWeight: parsedTotalWeight > 0 ? parsedTotalWeight : finalFineGoldWeight,
      purity: parsedPurity,
      fineGoldWeight: finalFineGoldWeight,
      description: "Moneda personalizada creada por el usuario.",
      isCustom: true,
    };
    setCustomCoins(prev => [...prev, newCoin]);
    setSelectedCoinId(newCoin.id);
    setIsAddingCoin(false);
    triggerNotification(`Moneda "${newCoin.name}" guardada correctamente.`);
    setNewCoinName(""); setNewCoinTotalWeight(""); setNewCoinPurity("0.900"); setNewCoinFineWeight("");
  };

  const handleDeleteCustomCoin = (id, e) => {
    e.stopPropagation();
    setConfirmDialog({
      isOpen: true, title: "Eliminar Moneda",
      message: "¿Estás seguro de eliminar esta moneda personalizada? En caso de estar en tu lote, se quitará.",
      onConfirm: () => {
        setCustomCoins(prev => prev.filter(c => c.id !== id));
        setCartItems(prev => prev.filter(item => item.coinId !== id));

                                <button onClick={() => handleUpdateCartQty(item.coinId, 0)} className="text-slate-500 hover:text-red-400 p-1.5 hover:bg-slate-800 rounded-lg transition-colors leading-none" title="Quitar del lote"><Trash2 className="w-3.5 h-3.5" /></button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      <div className="border-t border-slate-800 pt-3 mt-auto flex items-center justify-between gap-2 text-[11px] font-mono text-slate-400 bg-slate-950/20 p-2.5 rounded-xl">
                        <span>Peso Fino Acumulado Tot: <strong className="text-slate-200">{formatNumber(cartCalculations.totals.totalFineGoldGrams, 3)} gramos</strong></span>
                        <span>(~{formatNumber(cartCalculations.totals.totalFineGoldOunces, 3)} Onzas Troy)</span>
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-amber-500/20 rounded-3xl p-5 md:col-span-5 flex flex-col justify-between relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none" />
                      <div>
                        <div className="border-b border-slate-800 pb-3 mb-4">
                          <span className="text-[10px] font-bold tracking-wider text-amber-400 block uppercase font-mono">Consolidación Total Local</span>
                          <h4 className="text-base font-bold text-slate-200 font-display mt-0.5">Tasación del Lote Completo</h4>
                        </div>
                        <div className="space-y-4">
                          <div className="bg-slate-950 p-3 rounded-2xl border border-emerald-500/10">
                            <span className="text-[9px] text-emerald-400 font-mono font-bold block mb-1">TOTAL VALOR COMPRA (Vos cobrás si vendés)</span>
                            <div className="text-2xl font-extrabold text-emerald-300 font-display leading-tight">{formatCurrency(cartCalculations.totals.totalBuyPriceUsd, "USD")}</div>
                            <div className="text-xs text-slate-400 font-mono mt-0.5">Pesos ARS: <span className="text-emerald-400 font-bold">{formatCurrency(cartCalculations.totals.totalBuyPriceArs, "ARS")}</span></div>
                          </div>
                          <div className="bg-slate-950 p-3 rounded-2xl border border-amber-500/10">
                            <span className="text-[9px] text-amber-450 font-mono font-bold block mb-1">TOTAL VALOR VENTA (Vos pagás si comprás)</span>
                            <div className="text-2xl font-extrabold text-amber-200 font-display leading-tight">{formatCurrency(cartCalculations.totals.totalSellPriceUsd, "USD")}</div>
                            <div className="text-xs text-slate-400 font-mono mt-0.5">Pesos ARS: <span className="text-amber-200 font-bold">{formatCurrency(cartCalculations.totals.totalSellPriceArs, "ARS")}</span></div>
                          </div>
                        </div>
                        <div className="bg-slate-950 p-3 rounded-2xl border border-sky-500/20 mt-4 text-xs">
                          <span className="text-[9px] text-sky-400 font-mono font-bold block uppercase tracking-wider mb-1">TOTAL VALOR BASE EN ARGENTINA (-{settings.discountArgentinaPercent}%)</span>
                          <div className="text-xl font-extrabold text-sky-300 font-display leading-tight">{formatCurrency(cartCalculations.totals.totalLocalRefValueUsd, "USD")}</div>
                          <div className="text-[11px] text-slate-400 font-mono mt-0.5 flex justify-between items-center border-t border-slate-900 pt-1.5 gap-2"><span>Pesos ARS: <strong className="text-sky-400">{formatCurrency(cartCalculations.totals.totalLocalRefValueArs, "ARS")}</strong></span><span className="text-[10px] text-slate-500">Spot Intl: {formatCurrency(cartCalculations.totals.totalSpotValueUsd, "USD")}</span></div>
                        </div>
                      </div>
                      <div className="mt-5 pt-4 border-t border-slate-800/80">
                        <button onClick={() => {
                          const detailsText = `Detalle de Tasación de Lote en Argentina:` +
                            `\n• Peso Fino Total: ${formatNumber(cartCalculations.totals.totalFineGoldGrams, 3)}g (~${formatNumber(cartCalculations.totals.totalFineGoldOunces, 3)} oz)` +
                            `\n• Valor Compra: ${formatCurrency(cartCalculations.totals.totalBuyPriceUsd, "USD")} (${formatCurrency(cartCalculations.totals.totalBuyPriceArs, "ARS")})` +
                            `\n• Valor Venta: ${formatCurrency(cartCalculations.totals.totalSellPriceUsd, "USD")} (${formatCurrency(cartCalculations.totals.totalSellPriceArs, "ARS")})` +
                            `\n• Cotizado Dolar Blue: ${settings.usdExchangeRateArs} ARS y Spot ${settings.ouncePriceUsd} USD/oz.`;
                          copyText(detailsText);
                          triggerNotification("Cotización del lote copiada al portapapeles.");
                        }} className="w-full bg-slate-950 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/40 text-xs text-center py-2.5 px-3 rounded-xl text-amber-300 font-bold flex items-center justify-center gap-1.5 transition-all cursor-pointer">
                          <Share2 className="w-4 h-4" /> Copiar Ficha de Cotización
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </section>
      </main>

      {/* INFO MODAL */}
      {calculatorInfoOpen && (
        <div className="cc-fade fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setCalculatorInfoOpen(false)}>
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 overflow-hidden shadow-2xl relative" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-5">
              <div className="flex items-center gap-2"><Info className="w-5 h-5 text-amber-400" /><h3 className="text-lg font-bold font-display text-amber-200">Metodología de Valuación de Oro físico</h3></div>
              <button onClick={() => setCalculatorInfoOpen(false)} className="p-1 text-slate-400 hover:text-amber-400 font-mono text-sm uppercase font-semibold">Cerrar</button>
            </div>
            <div className="space-y-4 text-xs sm:text-sm text-slate-300 leading-relaxed max-h-[400px] overflow-y-auto pr-2">
              <p>El comercio de monedas de oro bruto (como centenarios, krugerrands, argentinos o libras) responde a fórmulas matemáticas estrictas, ajustadas por condiciones locales en Argentina. Aquí se describe el proceso paso a paso:</p>
              <h4 className="font-bold text-amber-300 font-display text-xs sm:text-sm">1. Obtención del Peso Fino (Gramos Neto de Oro)</h4>
              <p className="text-xs text-slate-400">Las monedas casi nunca son de oro 100% puro en su bruto ya que el oro puro es demasiado blando y se rayaría con facilidad. Se mezclan con cobre o plata (aleación). <br /><code className="text-amber-400 font-mono text-[11px] bg-slate-950 p-1 rounded mt-1 inline-block block border border-slate-850">Gramos de Oro Fino = Peso Bruto × Ley (Purity)</code>Por ejemplo, un Soberano pesa 7.988 gramos brutos pero tiene pureza de 22 quilates (ley 0.9167), lo que resulta en 7.322 gramos de oro fino.</p>
              <h4 className="font-bold text-amber-300 font-display text-xs sm:text-sm">2. Conversión a Onza Troy Spot</h4>
              <p className="text-xs text-slate-400">La unidad estándar internacional en el mercado de metales preciosos es la <strong>Onza Troy (31.1034768 gramos de metal puro)</strong>. El precio Spot cotiza por Onza Troy en dólares estadounidenses (USD). <br /><code className="text-amber-400 font-mono text-[11px] bg-slate-950 p-1 rounded mt-1 inline-block block border border-slate-850">Onzas Troy = Gramos de Oro Fino / 31.1034768</code></p>
              <h4 className="font-bold text-amber-300 font-display text-xs sm:text-sm">3. El Ajuste de Descuento Local en Argentina</h4>
              <p className="text-xs text-slate-400">En Argentina, el lingote físico o moneda cotiza normalmente con un <strong>descuento</strong> (habitualmente de entre el 2% y el 8%) respecto a la cotización internacional de Londres. Esto se debe a la brecha de exportación/importación, seguros de custodia y costos financieros locales. El cotizador aplica este descuento para hallar el <i>Precio Base Físico</i>.</p>
              <h4 className="font-bold text-emerald-300 font-display text-xs sm:text-sm">4. Spread / Márgenes de Compra y Venta (La Casa)</h4>
              <p className="text-xs text-slate-400">Como cualquier mercado físico de divisas o metales, las mesas de dinero y joyerías comerciales aplican un margen de intermediación:<br />• <strong>Compra (vos vendés):</strong> La casa te paga menos del precio base para retener un beneficio. (e.g., -5%)<br />• <strong>Venta (vos comprás):</strong> La casa cobra un recargo por sobre el precio de referencia para cubrir los costos. (e.g., +2%)</p>
              <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-[11px] font-mono leading-relaxed text-slate-400">
                <strong className="text-slate-200 block mb-1">Resumen del Flujo de Cotización:</strong>
                1. Peso Fino = Peso Bruto x Ley <br />
                2. Valor Spot USD = (Peso Fino / 31.1035) x Precio Spot de la Onza <br />
                3. Valor Base Argentina USD = Valor Spot USD x (1 - DescuentoArgentina / 100) <br />
                4. Compra Cliente USD = Valor Base Argentina USD x (1 - MargenCompra / 100) <br />
                5. Venta Cliente USD = Valor Base Argentina USD x (1 + MargenVenta / 100) <br />
                6. En Pesos ARS = Valor en USD x Cotización de Dólar Blue
              </div>
            </div>
            <div className="mt-6 pt-4 border-t border-slate-800 flex justify-end">
              <button onClick={() => setCalculatorInfoOpen(false)} className="bg-amber-500 text-slate-950 text-xs font-bold py-2.5 px-5 rounded-xl cursor-pointer hover:bg-amber-400 transition-all">Entendido</button>
            </div>
          </div>
        </div>
      )}

      {/* FOOTER */}
      <footer className="border-t border-slate-900 bg-slate-950 pt-8 pb-12 mt-12 text-slate-500 text-center text-xs">
        <div className="max-w-7xl mx-auto px-4 sm:px-6">
          <div className="flex justify-center items-center gap-1 mb-2 font-display text-slate-400 font-semibold"><Coins className="w-4 h-4 text-amber-500" /><span>Valuador Profesional de Metales Preciosos v2.4</span></div>
          <p className="max-w-md mx-auto leading-relaxed">Herramienta optimizada para joyerías, mesas numismáticas e inversores de monedas de oro en la República Argentina.</p>
          <div className="mt-4 flex flex-wrap justify-center gap-x-4 gap-y-1 text-[10px] font-mono text-slate-600">
            <span>Dólar Blue: {formatCurrency(settings.usdExchangeRateArs, "ARS", 0)}</span><span>•</span>
            <span>Oro Spot: {formatCurrency(settings.ouncePriceUsd, "USD")} / Oz t</span><span>•</span>
            <span>Parámetros 100% Personalizables</span>
          </div>
          <p className="mt-6 text-[10px] text-slate-700">Para fines informativos y de tasación física. Los valores pueden oscilar según la ley metálica, el estado de la pieza y el flete de plaza.</p>
        </div>
      </footer>

      {/* CONFIRM DIALOG */}
      {confirmDialog && confirmDialog.isOpen && (
        <div className="cc-fade fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full blur-2xl pointer-events-none" />
            <h3 className="font-bold font-display text-base text-slate-100 flex items-center gap-2 mb-2"><HelpCircle className="w-5 h-5 text-amber-500" />{confirmDialog.title}</h3>
            <p className="text-xs text-slate-400 leading-relaxed font-sans mb-6">{confirmDialog.message}</p>
            <div className="flex gap-3 justify-end">
              <button type="button" onClick={() => setConfirmDialog(null)} className="px-4 py-2 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-semibold text-slate-350 transition-all cursor-pointer">Cancelar</button>
              <button type="button" onClick={confirmDialog.onConfirm} className="px-5 py-2 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-lg shadow-amber-500/10 cursor-pointer">Aceptar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
